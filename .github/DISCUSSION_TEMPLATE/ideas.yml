body:
  - type: markdown
    attributes:
      value: |
        Search [Ideas](https://github.com/Sheldonmayhew/notaboek/discussions/categories/ideas) first. If someone has suggested it already, add to theirs or upvote it.
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Notaboek to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, or another app you use for it.
  - type: dropdown
    id: file-type
    attributes:
      label: Kind of file
      options:
        - Markdown (.md)
        - Plain text (.txt)
        - CSV or TSV
        - TaskPaper
        - PDF
        - Word (.docx)
        - A new kind of file
        - Not about one kind of file
